name: Test

# Pipeline de testes que o README e o DEPLOY.md ja descreviam, mas que nunca
# tinha sido criada: so existia o deploy.yml. Roda os testes do servidor em
# qualquer PR que toque em /server, com path filtering para nao gastar runner
# quando a alteracao for so do client.
#
# Os runners do GitHub tem Docker, entao os testes com Testcontainers sobem um
# MySQL de verdade e aplicam as migrations do Flyway aqui dentro.

on:
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/test.yml'
  push:
    branches: [main]
    paths:
      - 'server/**'
  workflow_dispatch:

jobs:
  server:
    name: Servidor (JUnit + Testcontainers)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura o JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Prepara o Gradle com cache
        uses: gradle/actions/setup-gradle@v4

      - name: Roda os testes
        working-directory: server
        run: ./gradlew test --no-daemon

      # Sem isto, um teste que falha so deixa a mensagem no log. O relatorio
      # em HTML diz qual assercao quebrou e com que valor.
      - name: Guarda o relatorio quando algum teste falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-de-testes
          path: server/build/reports/tests/test/
          retention-days: 7

name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# checks:write publishes test results; pull-requests:write posts coverage
# comments on PRs.
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  backend:
    name: Backend — build, unit tests, coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, spotless, checkstyle, unit tests + JaCoCo
        run: ./gradlew build

      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          check_name: Backend tests
          report_paths: server/build/test-results/test/TEST-*.xml

      - name: Comment coverage on the PR
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.7.1
        with:
          title: Backend coverage (JaCoCo)
          paths: server/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          # Informational only — unit coverage is low by design (e2e covers
          # the real flows), so no thresholds gate the PR.
          min-coverage-overall: 0
          min-coverage-changed-files: 0

  client:
    name: Client — lint & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Lint + typecheck
        run: |
          bun run lint
          bunx tsc -b

  e2e:
    name: E2E — Playwright against the compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # CI generates throwaway credentials — the stack is ephemeral and the
      # runner is destroyed after the job, so no repository secrets needed.
      - name: Create .env for CI
        run: |
          COORD_PASS="$(openssl rand -base64 24)"
          cat > .env <<EOF
          MYSQL_DATABASE=clinica_db
          MYSQL_USER=clinica_user
          MYSQL_PASSWORD=$(openssl rand -base64 24)
          MYSQL_ROOT_PASSWORD=$(openssl rand -base64 24)
          COORDINATOR_EMAIL=e2e-coordinator@clinica.test
          COORDINATOR_PASSWORD=${COORD_PASS}
          JWT_SECRET=$(openssl rand -hex 32)
          AUTH_COOKIE_SECURE=false
          CORS_ALLOWED_ORIGINS=http://localhost:3000
          VITE_API_URL=http://localhost:8080
          E2E_ADMIN_EMAIL=e2e-coordinator@clinica.test
          E2E_ADMIN_PASSWORD=${COORD_PASS}
          EOF

      - name: Start the compose stack
        run: docker compose up -d --build

      - name: Wait for the API
        run: timeout 240 bash -c 'until curl -sf http://localhost:8080/actuator/health >/dev/null; do sleep 3; done'

      - uses: oven-sh/setup-bun@v2
      - name: Install client deps + Chromium
        working-directory: client
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium

      # E2E_VIDEO=off — videos are a local demo tool only, never in CI.
      - name: Run Playwright (chromium)
        working-directory: client
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_VIDEO: 'off'
        run: bunx playwright test --project=chromium

      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          check_name: E2E tests
          report_paths: client/e2e/test-results/junit.xml

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/e2e/playwright-report
          retention-days: 7

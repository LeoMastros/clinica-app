spring:
  # Load the repo-root .env (KEY=VALUE) when present — lets plain
  # `./gradlew bootRun` pick up JWT_SECRET, COORDINATOR_*, etc.
  # Optional: absent in containers/CI where real env vars are used.
  config:
    import: optional:file:../.env[.properties]
  profiles:
    active: dev
  application:
    name: clinica-api
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  swagger-ui:
    # Keep the tag order declared in SwaggerConfig (Authentication, Users,
    # then alphabetical); 'alpha' would reshuffle it.
    tags-sorter: none
    # Within each tag, sort operations alphabetically by path.
    operations-sorter: alpha

app:
  bootstrap:
    # No defaults on purpose — coordinator credentials must come from the
    # environment and must never be committed to the repository.
    coordinator-email: ${COORDINATOR_EMAIL:}
    coordinator-password: ${COORDINATOR_PASSWORD:}
  jwt:
    # Required — no default. Generate with: openssl rand -hex 32
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  auth:
    # Secure flag on the refresh cookie. false for local HTTP dev,
    # MUST be true in production (HTTPS).
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: Authorization,Content-Type
    allow-credentials: true
    max-age: 3600

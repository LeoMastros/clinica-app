name: Deploy

# Deploys only after the Tests workflow passes on main — a broken build or
# failing test suite never reaches the VM. Manual dispatch still available
# for emergency redeploys.
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Dev
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Deploy via SSH na Oracle VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: ${{ secrets.ORACLE_SSH_PORT }}
          script: |
            set -e  # any failure aborts the deploy and fails the job
            cd ~/clinica-app
            # Deploy VMs don't merge — fetch + hard reset is deterministic and
            # can't diverge (discards any stray local commits on the box).
            git fetch origin main
            git reset --hard origin/main

            # Pre-deploy DB snapshot — migrations run on boot, and a bad one
            # shouldn't cost real data. Failure here never blocks a deploy
            # (e.g. mysql not up yet on first boot).
            set -a && . ./.env && set +a
            mkdir -p ~/clinica-backups
            docker compose exec -T mysql \
              mysqldump -u root -p"$MYSQL_ROOT_PASSWORD" --single-transaction clinica_db \
              > ~/clinica-backups/clinica_db-$(date +%F-%H%M).sql 2>/dev/null || true

            docker compose up --build -d
            docker image prune -f

            # Health gate: a crash-looping backend must fail the job, not
            # silently pass. ~6 min budget for boot + flyway migrations.
            for i in $(seq 1 36); do
              if curl -sf http://localhost:8080/actuator/health | grep -q '"UP"'; then
                echo "Backend healthy after ~$((i * 10))s"
                exit 0
              fi
              sleep 10
            done
            echo "Backend never became healthy — recent logs:"
            docker compose logs server --tail=40
            exit 1

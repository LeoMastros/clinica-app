spring.application.name=clinica-api
server.forward-headers-strategy=framework
server.servlet.context-path=/api/v1

# Em producao o docker-compose injeta SPRING_DATASOURCE_*; o padrao abaixo aponta
# para o MySQL de desenvolvimento do server/compose.yaml (porta 3307).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/clinica_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:clinica_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# O Flyway e o dono do schema. O Hibernate so confere se as entidades batem com
# as tabelas criadas pelas migrations, nunca altera nada sozinho.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# As squads escrevem migrations em faixas separadas (V1-V19 base e agenda,
# V20-V39 cadastro e prontuarios, V40-V59 financeiro), entao elas nao entram no
# repositorio em ordem crescente. Sem isto, o Flyway recusa aplicar uma versao
# menor do que a ja registrada e o deploy quebra para todo mundo assim que uma
# faixa mais baixa chegar depois de uma mais alta.
spring.flyway.out-of-order=true

# Segredo do JWT. Precisa de no minimo 32 caracteres (HMAC SHA-256) e vem do
# ambiente; o valor abaixo so existe para desenvolvimento local.
# Gerar um forte com: openssl rand -base64 48
clinica.seguranca.jwt.segredo=${CLINICA_JWT_SEGREDO:troque-este-segredo-apenas-para-desenvolvimento-local}
clinica.seguranca.jwt.validade=${CLINICA_JWT_VALIDADE:PT8H}

# Primeiro administrador, criado no boot apenas se a tabela estiver vazia.
# Sem estas variaveis nenhuma conta e criada (ver AdminInicial).
clinica.admin-inicial.nome=${CLINICA_ADMIN_INICIAL_NOME:Administrador}
clinica.admin-inicial.email=${CLINICA_ADMIN_INICIAL_EMAIL:}
clinica.admin-inicial.senha=${CLINICA_ADMIN_INICIAL_SENHA:}
